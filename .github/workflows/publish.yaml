name: Publish pipeline
on:
  push:
    branches: ['main']
    tags: ['**']
  pull_request:
    branches: ['**']
jobs:
  # ============================================================================
  # Setup the mappings for all the subsequent jobs.
  # ============================================================================
  mappings:
    name: Generate mappings
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.mappings.outputs.semver }}
      semver: ${{ steps.mappings.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup mappings
        id: mappings
        run: .github/scripts/setup.sh
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: .github/scripts/version_check.sh
      - name: Debug mappings
        run: echo "$MAPPINGS" | jq -C .
        env:
          MAPPINGS: ${{ toJson(steps.mappings.outputs) }}

  # ============================================================================
  # Lint the stylesheets with Stylelint
  # ============================================================================
  lint:
    name: Lint with Stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name:
      - name: Lint with Stylelint
        run: npm run lint

  # ============================================================================
  # Publish the package on GitHub Registry
  # ============================================================================
  publish:
    name: Publish package on GitHub Registry
    if: github.event_name == 'push'
    needs: [mappings, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build stable package
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run build ${{ needs.mappings.outputs.version }}
      - name: Build development package
        if: github.ref == 'refs/heads/main'
        run: npm run build ${{ needs.mappings.outputs.semver }}
      - name: Publish package to GitHub Registry
        run: npm run publish